<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="indexstyle.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h2>Поиск первого большего числа</h2>
    <p>Введите основное число и набор чисел. Программа найдёт первое число в наборе, которое больше основного. Для окончания ввода списка введите "0".</p>
  </header>
  <div class="inputs">
    <label for="mainNum">Основное число:</label>
    <div class="mainNumWrap">
      <input type="number" id="mainNum">
    </div>
    <label for="num">Число 1:</label>
    <div class="mainNumWrap">
      <input type="number" id="num">
    </div>
  </div>
</body>
</html>
